name: Build and Release macOS App

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build release executable
        run: swift build -c release

      - name: Assemble app bundle
        shell: bash
        run: |
          set -euo pipefail
          APP="Convertly.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp ".build/release/Convertly" "$APP/Contents/MacOS/Convertly"
          PLIST="$APP/Contents/Info.plist"
          /usr/libexec/PlistBuddy -c "Add :CFBundleName string Convertly" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleDisplayName string Convertly" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleIdentifier string com.thisulzen.convertly" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleExecutable string Convertly" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundlePackageType string APPL" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :CFBundleVersion string 1" "$PLIST"
          VERSION="${GITHUB_REF_NAME#v}"
          if [[ -z "$VERSION" || "$VERSION" == "$GITHUB_REF_NAME" ]]; then VERSION="0.1.0"; fi
          /usr/libexec/PlistBuddy -c "Add :CFBundleShortVersionString string $VERSION" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :LSMinimumSystemVersion string 14.0" "$PLIST"
          /usr/libexec/PlistBuddy -c "Add :NSHighResolutionCapable bool true" "$PLIST"
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" Convertly-macOS.zip

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Convertly-macOS.zip

      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Convertly-macOS
          path: Convertly-macOS.zip
