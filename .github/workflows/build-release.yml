name: Build and Release macOS App

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build release executable
        run: swift build -c release
      - name: Assemble app bundle
        shell: bash
        run: |
          APP='Convertly.app'
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp '.build/release/Convertly' "$APP/Contents/MacOS/Convertly"
          VERSION="${GITHUB_REF_NAME#v}"
          cat > "$APP/Contents/Info.plist" <<PLIST
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0"><dict>
  <key>CFBundleName</key><string>Convertly</string>
  <key>CFBundleDisplayName</key><string>Convertly</string>
  <key>CFBundleIdentifier</key><string>com.thisulzen.convertly</string>
  <key>CFBundleExecutable</key><string>Convertly</string>
  <key>CFBundlePackageType</key><string>APPL</string>
  <key>CFBundleVersion</key><string>1</string>
  <key>CFBundleShortVersionString</key><string>${VERSION:-0.1.0}</string>
  <key>LSMinimumSystemVersion</key><string>14.0</string>
  <key>NSHighResolutionCapable</key><true/>
</dict></plist>
PLIST
          /usr/bin/ditto -c -k --sequesterRsrc --keepParent "$APP" Convertly-macOS.zip
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: Convertly-macOS.zip
      - name: Upload build artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: Convertly-macOS
          path: Convertly-macOS.zip